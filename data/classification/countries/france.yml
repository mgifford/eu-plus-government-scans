# France - Country Governance Model
# Last reviewed: 2026-07-15
# Rule version: 1

country:
  code: FR
  name: France

rule_version: 1
last_reviewed: "2026-07-15"

administrative_context: >
  France is a unitary semi-presidential republic with a strong central
  government. The administrative structure includes the President, Prime
  Minister, Council of Ministers, national ministries, prefectures,
  departments, regions, municipalities, and numerous public establishments.
  France has a centralized administrative tradition with devolution to
  regions and departments.

central_administration_definition: >
  National executive ministries, directorates, agencies, and shared services
  that form part of, or are directly accountable to, the Government of France
  (Gouvernement) through the Prime Minister and Council of Ministers. This
  includes the core central administration (État central) but excludes
  Parliament, the judiciary, local authorities, and independent public bodies.

include:
  organization_types:
    - ministry
    - directorate
    - national_agency
    - executive_office
    - shared_service
    - central_administration

exclude:
  organization_types:
    - parliament
    - judiciary
    - regional_government
    - departmental_government
    - municipality
    - public_university
    - independent_regulator
    - central_bank
    - audit_body
    - public_broadcaster
    - state_owned_enterprise
    - public_establishment

domain_patterns:
  supporting:
    - "*.gouv.fr"
    - "*.fr"
  high_confidence:
    - "www.gouvernement.fr"
    - "gouvernement.fr"

exceptions:
  include:
    - domain: "www.gouvernement.fr"
      reason: "Official Government portal - central administration"
      source: "https://www.gouvernement.fr/"
    - domain: "www.service-public.fr"
      reason: "Service-Public.fr - official public service portal"
      source: "https://www.service-public.fr/"
    - domain: "www.economie.gouv.fr"
      reason: "Ministry of Economy - central administration"
      source: "https://www.economie.gouv.fr/"
    - domain: "www.interieur.gouv.fr"
      reason: "Ministry of Interior - central administration"
      source: "https://www.interieur.gouv.fr/"
    - domain: "www.education.gouv.fr"
      reason: "Ministry of Education - central administration"
      source: "https://www.education.gouv.fr/"

  exclude:
    - domain: "www.senat.fr"
      reason: "Senate - legislative branch, not central administration"
      source: "https://www.senat.fr/"
    - domain: "www.assemblee-nationale.fr"
      reason: "National Assembly - legislative branch, not central administration"
      source: "https://www.assemblee-nationale.fr/"
    - domain: "www.conseil-constitutionnel.fr"
      reason: "Constitutional Council - judicial branch, not central administration"
      source: "https://www.conseil-constitutionnel.fr/"
    - domain: "www.banque-france.fr"
      reason: "Banque de France - independent central bank"
      source: "https://www.banque-france.fr/"
    - domain: "www.csa.fr"
      reason: "Conseil supérieur de l'audiovisuel - independent regulator"
      source: "https://www.csa.fr/"
    - domain: "www.francetv.fr"
      reason: "France Télévisions - public broadcaster"
      source: "https://www.francetv.fr/"
    - domain: "www.iledefrance.fr"
      reason: "Île-de-France region - regional government"
      source: "https://www.iledefrance.fr/"

authoritative_sources:
  - name: "Service-Public.fr - Organisations"
    url: "https://www.service-public.fr/"
    description: "Official directory of public organizations"
  - name: "Gouvernement.fr - Ministères"
    url: "https://www.gouvernement.fr/les-ministeres"
    description: "Official list of ministries"
  - name: "Journal Officiel - Textes généraux"
    url: "https://www.legifrance.gouv.fr/"
    description: "Official legal texts and administrative structure"

known_ambiguities:
  - "Établissements publics (public establishments) have varying degrees of autonomy"
  - "Ecoles nationales (national schools) may be central or independent"
  - "Groupements d'intérêt public (GIP) have mixed public-private governance"
  - "Régions and départements have elected governments with significant autonomy"
  - "Overseas territories have unique administrative statuses"

classification_notes: >
  France's centralized administrative tradition means many national services
  are part of the central administration. However, the country has devolved
  significant powers to regions and departments since 1982. Public
  establishments (établissements publics) operate with varying degrees of
  autonomy from the central government. The distinction between ministries
  and independent public bodies requires examining the legal framework.

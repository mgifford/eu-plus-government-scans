# Curated inventory of government design systems, brand identities, and
# design guidance.  Read by src/lib/design_system_registry.py.
#
# This table is curated by hand, exactly like data/providers/jurisdictions.yaml:
# there is no selector for "official national design system", so a machine cannot
# derive it.  Rules for editing:
#
# - country_code uses UPPER_SNAKE_CASE matching the TOON seed filenames
#   (united-kingdom-uk.toon -> UNITED_KINGDOM_UK).  Leave it empty for
#   supranational (european-union) or unconfirmed entries.
# - type is one of: design_system | brand_identity | accessibility_guide.
# - adoption_signatures are case-insensitive substrings expected in the HTML of
#   sites that consume the system (class prefixes, asset paths, package names).
#   They are what makes "how many sites use system X" measurable.
#   **Leave the list empty rather than guess.**  A wrong signature reports false
#   adoption.  Entries without signatures are counted in the coverage report so
#   the curation work stays visible and finite.
# - Anything below confidence: high carries needs_review: true.
# - This list is a starting inventory, not a complete one: countries with no
#   entry here are unknown, not design-system-free.

design_systems:
  - name: NL Design System
    country_code: NETHERLANDS
    type: design_system
    scope: national
    url: https://nldesignsystem.nl/
    repo: https://github.com/nl-design-system
    adoption_signatures:
      - nl-design-system
    confidence: medium
    needs_review: true
    notes: >-
      Cross-government Dutch design system; adoption signatures need
      confirmation against consuming sites.


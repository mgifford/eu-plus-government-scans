# Provider jurisdictions — which organisation operates a third-party host, and
# under which country's jurisdiction it sits.
#
# WHY THIS FILE EXISTS
# The scan data records that a government site loads assets from
# "googleapis.com". It cannot say that this is Google LLC, a US company, which
# is the fact a digital-sovereignty question turns on. Nothing in the scan
# pipeline can derive that; it has to be curated.
#
# HOW TO READ `jurisdiction`
# It is the country of the operating or parent company — where the organisation
# is incorporated and therefore whose law it primarily answers to. It is NOT a
# statement about where servers are, where data is processed, or which entity a
# specific contract is with. A US company's Irish subsidiary is still recorded
# as US here, because the parent's jurisdiction is what a sovereignty analysis
# is usually asking about; anything more specific is a legal question this
# dataset does not attempt to answer.
#
# ACCURACY
# Every entry carries a `confidence`. Entries marked `needs_review: true` are
# plausible but unverified and MUST be checked against a primary source (company
# registry, imprint, terms of service) before being relied on. A wrong
# nationality claim in a sovereignty report is worse than no claim, so a host
# nobody can confirm is left out of this file entirely rather than guessed at —
# it then shows up as "unclassified" in the coverage report, which is honest.
#
# `kind` values:
#   commercial  — a company
#   government  — a public body (some appear here because the scanner's
#                 government registry does not yet recognise them)
#   nonprofit   — foundation or charity
#   community   — an open-source project with no single controlling company
#
# Add entries by running `python3 -m src.cli.provider_coverage`, which lists the
# highest-impact unclassified hosts.


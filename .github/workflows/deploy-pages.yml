name: Deploy GitHub Pages

on:
  # Re-deploy whenever docs are updated (e.g. after a scan-progress commit).
  push:
    branches: [main]
    paths: ['docs/**']

  # Also deploy after the scan-progress report is regenerated.
  workflow_run:
    workflows: ["Generate Scan Progress Report"]
    types: [completed]

  # Allow manual trigger at any time.
  workflow_dispatch:

# Allow only one pages deployment at a time; newer runs cancel queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

# Permissions required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Scan Accessibility Statements

on:
  # Run every 4 hours — with --skip-recently-scanned-days 7 each run focuses
  # only on URLs not yet scanned in the past week, so the full URL corpus is
  # covered progressively without hammering government servers repeatedly.
  schedule:
    - cron: '30 */4 * * *'

  # Allow manual trigger for a single country or all countries
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second (keep low for polite crawling)'
        required: false
        default: '1.0'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within this many days (0 = re-scan all, 7 = weekly refresh)'
        required: false
        default: '7'
        type: string

# Each scan workflow uses its own concurrency group so runs can proceed in
# parallel without blocking each other while still preventing self-overlap.
concurrency:
  group: metadata-scans-accessibility
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read

    steps:
      - name: Record scheduled vs actual start time
        id: timing
        run: |
          # github.event.schedule is only set for schedule-triggered runs; for
          # workflow_dispatch there is no "intended" time to compare against.
          echo "actual_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "scheduled_cron=${{ github.event.schedule || 'n/a (manual dispatch)' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Find latest metadata artifact run ID
        id: find-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=validation-metadata&per_page=1" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' 2>/dev/null || echo "")
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          if [ -n "$RUN_ID" ]; then
            echo "Found validation-metadata artifact from run $RUN_ID"
          else
            echo "No validation-metadata artifact found — will start with fresh database"
          fi

      - name: Download previous metadata DB (if exists)
        if: steps.find-metadata.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: validation-metadata
          path: data/
          run-id: ${{ steps.find-metadata.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run accessibility scan (specific country)
        id: scan-country
        if: ${{ github.event.inputs.country != '' }}
        run: |
          echo "scan_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          set -o pipefail
          SKIP_DAYS="${{ github.event.inputs.skip_recently_scanned_days || '7' }}"
          python3 -m src.cli.scan_accessibility \
            --country "${{ github.event.inputs.country }}" \
            --rate-limit "${{ github.event.inputs.rate_limit }}" \
            --skip-recently-scanned-days "$SKIP_DAYS" \
            2>&1 | tee accessibility-scan-output.txt
          echo "scan_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run accessibility scan (all countries)
        id: scan-all
        if: ${{ github.event.inputs.country == '' || github.event_name == 'schedule' }}
        run: |
          echo "scan_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          set -o pipefail
          SKIP_DAYS="${{ github.event.inputs.skip_recently_scanned_days || '7' }}"
          python3 -m src.cli.scan_accessibility \
            --all \
            --max-runtime 55 \
            --rate-limit "${{ github.event.inputs.rate_limit || '1.0' }}" \
            --skip-recently-scanned-days "$SKIP_DAYS" \
            2>&1 | tee accessibility-scan-output.txt
          echo "scan_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            accessibility-scan-output.txt
            data/toon-seeds/countries/**_accessibility.toon
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      - name: Guard against overwriting shared metadata with data-loss result
        if: always()
        id: db-guard
        run: |
          PREV_RUN_ID="${{ steps.find-metadata.outputs.run_id }}"
          if [ -n "$PREV_RUN_ID" ] && [ ! -f "data/metadata.db" ]; then
            echo "safe_to_upload=false" >> $GITHUB_OUTPUT
            echo "WARNING: Previous artifact found (run $PREV_RUN_ID) but data/metadata.db is missing after download. Skipping overwrite to protect existing data."
          else
            echo "safe_to_upload=true" >> $GITHUB_OUTPUT
            echo "Database present (or no prior artifact) — safe to update shared metadata."
          fi

      - name: Update shared validation metadata
        if: always() && steps.db-guard.outputs.safe_to_upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-metadata
          path: |
            data/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
          compression-level: 0

      - name: Write operational summary
        if: always()
        run: |
          # Phase 1 instrumentation (WORKFLOW_ORCHESTRATION_AUDIT.md Section 12).
          # Parses the "Reachable: N" / "Unreachable: N" lines already emitted
          # by AccessibilityScannerJob for each country processed this run and
          # sums them, since a single --all invocation covers multiple
          # countries. Throughput/cycle-projection fields land in Phase 5 once
          # the capacity-tracking logic in the audit doc is implemented.
          SCAN_START="${{ steps.scan-country.outputs.scan_start || steps.scan-all.outputs.scan_start }}"
          SCAN_END="${{ steps.scan-country.outputs.scan_end || steps.scan-all.outputs.scan_end }}"

          ATTEMPTED="unknown"
          FAILED="unknown"
          if [ -f accessibility-scan-output.txt ]; then
            # Line-anchored (not just a "Reachable:" substring match) so this
            # can never accidentally pick up the "Unreachable:" line too, and
            # uses portable POSIX grep -E instead of GNU-only -P/\K.
            SUM_REACHABLE=$(grep -oE '^[[:space:]]*Reachable:[[:space:]]+[0-9]+' accessibility-scan-output.txt \
              | awk -F: '{sum+=$2} END {print sum+0}')
            SUM_UNREACHABLE=$(grep -oE '^[[:space:]]*Unreachable:[[:space:]]+[0-9]+' accessibility-scan-output.txt \
              | awk -F: '{sum+=$2} END {print sum+0}')
            [ -n "$SUM_REACHABLE" ] && ATTEMPTED="$SUM_REACHABLE"
            [ -n "$SUM_UNREACHABLE" ] && FAILED="$SUM_UNREACHABLE"
          fi

          {
            echo "## Accessibility Scan — Operational Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Scanner | accessibility |"
            echo "| Scheduled start (cron) | ${{ steps.timing.outputs.scheduled_cron }} |"
            echo "| Actual job start | ${{ steps.timing.outputs.actual_start }} |"
            echo "| Scan step start | $SCAN_START |"
            echo "| Scan step end | $SCAN_END |"
            echo "| URLs reachable (attempted successfully) | $ATTEMPTED |"
            echo "| URLs unreachable (attempted, failed) | $FAILED |"
            echo "| Rate limit | ${{ github.event.inputs.rate_limit || '1.0' }} req/sec |"
            echo "| Skip-recently-scanned window | ${{ github.event.inputs.skip_recently_scanned_days || '7' }} days |"
            echo "| Run conclusion | ${{ job.status }} |"
            echo "| Workflow run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Display raw scan log tail
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Raw Scan Log (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f accessibility-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 accessibility-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

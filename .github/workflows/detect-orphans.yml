name: Detect Orphan Domains

on:
  # Run monthly on the 1st at 06:00 UTC
  schedule:
    - cron: '0 6 1 * *'

  # Allow manual trigger
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run orphan detection
        run: |
          python -m src.cli.detect_orphans

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/orphan-domains-report.json

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit"
          else
            git commit -m "data: Monthly orphan domain detection report [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload orphan report artifact
        uses: actions/upload-artifact@v7
        with:
          name: orphan-report
          path: docs/data/orphan-domains-report.json
          retention-days: 365
          overwrite: true

name: Scan Accessibility Overlays

on:
  # Trigger manually only — overlay adoption does not change frequently enough
  # to warrant a scheduled scan.  Run this when you need a fresh inventory of
  # which government sites are using accessibility overlay products.
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second (keep low for polite crawling)'
        required: false
        default: '1.0'
        type: string

# Each scan workflow uses its own concurrency group so runs can proceed in
# parallel without blocking each other while still preventing self-overlap.
concurrency:
  group: metadata-scans-overlays
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        id: merge-metadata
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Run overlay scan (specific country)
        if: ${{ github.event.inputs.country != '' }}
        run: |
          python3 -m src.cli.scan_overlays \
            --country "${{ github.event.inputs.country }}" \
            --rate-limit "${{ github.event.inputs.rate_limit }}" \
            2>&1 | tee overlay-scan-output.txt

      - name: Run overlay scan (all countries)
        if: ${{ github.event.inputs.country == '' }}
        run: |
          python3 -m src.cli.scan_overlays \
            --all \
            --max-runtime 55 \
            --rate-limit "${{ github.event.inputs.rate_limit || '1.0' }}" \
            2>&1 | tee overlay-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlay-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            overlay-scan-output.txt
            data/toon-seeds/countries/**_overlays.toon
          retention-days: 90
          if-no-files-found: warn

      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact overlay-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload overlay-metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: overlay-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Display scan summary
        if: always()
        run: |
          echo "## Accessibility Overlay Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f overlay-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 overlay-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '1.0' }} req/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

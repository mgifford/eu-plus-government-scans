name: Scan Lighthouse

on:
  # Allow manual trigger for a single country or all countries
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all'
        required: false
        type: string
      rate_limit:
        description: 'Maximum Lighthouse runs per second (default: 0.2 = one every 5 s)'
        required: false
        default: '0.2'
        type: string

# Share concurrency group with other scan workflows so only one
# scan runs at a time, protecting the shared metadata artifact.
concurrency:
  group: validation-runs
  cancel-in-progress: false

jobs:
  scan-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse CLI
        run: |
          npm install -g lighthouse

      - name: Download previous metadata DB (if exists)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validation-metadata
          path: data/

      - name: Run Lighthouse scan (specific country)
        if: ${{ github.event.inputs.country != '' }}
        run: |
          python3 -m src.cli.scan_lighthouse \
            --country "${{ github.event.inputs.country }}" \
            --rate-limit "${{ github.event.inputs.rate_limit }}" \
            2>&1 | tee lighthouse-scan-output.txt

      - name: Run Lighthouse scan (all countries)
        if: ${{ github.event.inputs.country == '' || github.event_name == 'schedule' }}
        run: |
          python3 -m src.cli.scan_lighthouse \
            --all \
            --max-runtime 110 \
            --rate-limit "${{ github.event.inputs.rate_limit || '0.2' }}" \
            2>&1 | tee lighthouse-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            lighthouse-scan-output.txt
            data/toon-seeds/countries/**_lighthouse.toon
          retention-days: 90
          if-no-files-found: warn

      - name: Update shared validation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-metadata
          path: |
            data/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Display scan summary
        if: always()
        run: |
          echo "## Lighthouse Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lighthouse-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 lighthouse-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '0.2' }} runs/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

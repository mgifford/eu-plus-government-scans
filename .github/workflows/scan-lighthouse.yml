name: Scan Lighthouse

on:
  # Run every 6 hours to build up progressive coverage.
  # With --concurrency 3 and --only-categories=performance,accessibility,
  # best-practices,seo and --lighthouse-timeout-ms 45000, each URL takes
  # ~15-30 s, giving significantly higher throughput per day.  With
  # --skip-recently-scanned-days 30 each URL is
  # refreshed at most once per month, so the focus stays on uncovered URLs.
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger for a single country or all countries
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all'
        required: false
        type: string
      rate_limit:
        description: 'Maximum Lighthouse runs per second (default: 0.5)'
        required: false
        default: '0.5'
        type: string
      concurrency:
        description: 'Maximum parallel Lighthouse processes (default: 3)'
        required: false
        default: '3'
        type: string
      lighthouse_timeout_ms:
        description: 'Lighthouse internal timeout in milliseconds (default: 30000)'
        required: false
        default: '30000'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within this many days (0 = re-scan all, 30 = monthly refresh)'
        required: false
        default: '30'
        type: string

# Lighthouse has its own concurrency group so frequent metadata-scan workflows
# (social media every 2 h, tech every 4 h) can never cancel a Lighthouse run.
concurrency:
  group: lighthouse-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  scan-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Lighthouse CLI
        run: |
          npm install -g lighthouse --no-audit --no-fund

      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Run Lighthouse scan (specific country)
        if: ${{ github.event.inputs.country != '' }}
        run: |
          set -o pipefail
          python3 -m src.cli.scan_lighthouse \
            --country "${{ github.event.inputs.country }}" \
            --rate-limit "${{ github.event.inputs.rate_limit || '0.5' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '3' }}" \
            --lighthouse-timeout-ms "${{ github.event.inputs.lighthouse_timeout_ms || '30000' }}" \
            --skip-recently-scanned-days "${{ github.event.inputs.skip_recently_scanned_days || '30' }}" \
            --only-categories "performance,accessibility,best-practices,seo" \
            --throttling-method "provided" \
            2>&1 | tee lighthouse-scan-output.txt

      - name: Run Lighthouse scan (all countries)
        if: ${{ github.event.inputs.country == '' || github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          python3 -m src.cli.scan_lighthouse \
            --all \
            --max-runtime 55 \
            --rate-limit "${{ github.event.inputs.rate_limit || '0.5' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '3' }}" \
            --lighthouse-timeout-ms "${{ github.event.inputs.lighthouse_timeout_ms || '30000' }}" \
            --skip-recently-scanned-days "${{ github.event.inputs.skip_recently_scanned_days || '30' }}" \
            --only-categories "performance,accessibility,best-practices,seo" \
            --throttling-method "provided" \
            2>&1 | tee lighthouse-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            lighthouse-scan-output.txt
            data/toon-seeds/countries/**_lighthouse.toon
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always()
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact lighthouse-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload lighthouse-metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Display scan summary
        if: always()
        run: |
          echo "## Lighthouse Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lighthouse-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 lighthouse-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '0.5' }} runs/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrency: ${{ github.event.inputs.concurrency || '3' }} parallel processes" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse timeout: ${{ github.event.inputs.lighthouse_timeout_ms || '30000' }} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Skip recently scanned: ${{ github.event.inputs.skip_recently_scanned_days || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

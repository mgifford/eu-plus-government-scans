name: Reopen Validation Cycle

on:
  # Run quarterly (1st day of Jan, Apr, Jul, Oct at midnight)
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  
  # Allow manual trigger
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# These four workflows are the only ones that write the validation-metadata
# artifact, and they share mutable batch-cycle state (validation_batch_state,
# issue_trigger_runs) that a row-level merge cannot reconcile. They therefore
# share one concurrency group so only one writes at a time. Every other scanner
# owns its own artifact and is no longer serialized against anything.
concurrency:
  group: validation-metadata-writers
  cancel-in-progress: false

jobs:
  reopen-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Required by scripts/fetch-metadata-artifacts.sh.  Without it the
      # artifact listing 403s, the merge starts from an empty database, and the
      # upload below replaces validation_batch_state and issue_trigger_runs
      # with nothing.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Start new validation cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m src.cli.validate_urls_batch \
            --batch-mode \
            --batch-size 5 \
            --rate-limit 2.0 \
            --create-issue \
            2>&1 | tee cycle-start-output.txt
      
      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always()
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact validation-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload validation-metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Display summary
        if: always()
        run: |
          echo "## New Validation Cycle Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new quarterly validation cycle has been initiated." >> $GITHUB_STEP_SUMMARY
          echo "Check the created GitHub issue for progress tracking." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The batch validation workflow will continue processing countries every 2 hours." >> $GITHUB_STEP_SUMMARY

name: Scan Technology Stack

on:
  # Run every 8 hours — with --skip-recently-scanned-days 30 each run focuses
  # only on URLs not yet scanned in the past month.
  # 3 runs/day × ~6,600 URLs/run (55 min @ 2 req/s) covers the ~88k URL corpus
  # in roughly 5 days, giving monthly full-corpus coverage.
  schedule:
    - cron: '0 */8 * * *'

  # Allow manual trigger for a single country or all countries
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second'
        required: false
        default: '2.0'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within this many days (0 = re-scan all, 30 = monthly refresh)'
        required: false
        default: '30'
        type: string
      limit:
        description: 'Hard limit on the number of URLs to scan (Optional — e.g., 250, 500)'
        required: false
        type: string

# Each scan workflow uses its own concurrency group so runs can proceed in
# parallel without blocking each other while still preventing self-overlap.
concurrency:
  group: metadata-scans-technology
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-technology:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Run technology scan (specific country)
        if: ${{ github.event.inputs.country != '' }}
        run: |
          set -o pipefail
          SKIP_DAYS="${{ github.event.inputs.skip_recently_scanned_days || '30' }}"
          
          # Build arguments dynamically to support optional --limit
          ARGS=(
            --country "${{ github.event.inputs.country }}"
            --rate-limit "${{ github.event.inputs.rate_limit }}"
            --skip-recently-scanned-days "$SKIP_DAYS"
          )
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS+=(--max-urls "${{ github.event.inputs.limit }}")
          fi
          
          python3 -m src.cli.scan_technology "${ARGS[@]}" 2>&1 | tee tech-scan-output.txt

      - name: Run technology scan (all countries)
        if: ${{ github.event.inputs.country == '' || github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          SKIP_DAYS="${{ github.event.inputs.skip_recently_scanned_days || '30' }}"
          
          # Build arguments dynamically to support optional --limit and run duration
          ARGS=(
            --all
            --max-runtime 55
            --rate-limit "${{ github.event.inputs.rate_limit || '2.0' }}"
            --skip-recently-scanned-days "$SKIP_DAYS"
          )
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS+=(--max-urls "${{ github.event.inputs.limit }}")
          fi
          
          python3 -m src.cli.scan_technology "${ARGS[@]}" 2>&1 | tee tech-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tech-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            tech-scan-output.txt
            data/toon-seeds/countries/**_tech.toon
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always()
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact technology-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload technology-metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technology-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Display scan summary
        if: always()
        run: |
          echo "## Technology Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tech-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 tech-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '2.0' }} req/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Skip Recently Scanned: ${{ github.event.inputs.skip_recently_scanned_days || '7' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

name: Draft Weekly Mastodon Digest

# Drafts only.  This workflow turns last week's scan results into short posts
# and opens a review issue labelled `digest-draft`.  Nothing is published until
# a maintainer runs "Post weekly digest to Mastodon" (post-digest.yml) for a
# draft they have checked.  See docs/weekly-digest.md.

on:
  schedule:
    # Mondays, after the week it summarises has ended.  Minute 41 keeps clear
    # of the scan workflows' start times.
    - cron: "41 7 * * 1"
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Last day of the week to draft, YYYY-MM-DD (default: yesterday, UTC). Re-running a week replaces its issue text."
        required: false
        default: ""

concurrency:
  group: weekly-digest
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit the evidence file the posts link to
      issues: write     # open or update the review issue
      actions: read     # download the scan metadata artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only: this workflow never uploads a metadata artifact, so it only
      # fetches the two it reads.  See src/lib/metadata_merge.py.
      - name: Collect scan metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_ARTIFACT_NAMES: "accessibility-metadata social-media-metadata"
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge scan metadata
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Draft posts
        id: draft
        env:
          WEEK_ENDING: ${{ inputs.week_ending }}
        run: |
          ARGS=(--db data/metadata.db --evidence-dir docs/data/digest
                --output-dir digest-output --repo "$GITHUB_REPOSITORY")
          if [ -n "$WEEK_ENDING" ]; then
            ARGS+=(--week-ending "$WEEK_ENDING")
          fi
          python3 -m src.cli.generate_weekly_digest "${ARGS[@]}"
          {
            echo "count=$(jq '.drafts | length' digest-output/drafts.json)"
            echo "week=$(jq -r '.week_ending' digest-output/drafts.json)"
            echo "title=$(jq -r '.title' digest-output/drafts.json)"
          } >> "$GITHUB_OUTPUT"

      # The evidence file lists links harvested from page content; mask any
      # credential that slipped through before it is committed or shown.
      - name: Mask credentials in digest output
        run: python3 -m src.cli.redact_secrets digest-output docs/data/digest

      - name: Summarise
        run: |
          {
            echo "## Weekly digest: week ending ${{ steps.draft.outputs.week }}"
            echo
            jq -r '.drafts[] | "- Drafted: **\(.title)** (\(.length) characters)"' digest-output/drafts.json
            jq -r '.skipped[] | "- Skipped: **\(.title)**: \(.reason)"' digest-output/drafts.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drafts
        uses: actions/upload-artifact@v7
        with:
          name: weekly-digest-drafts
          path: |
            digest-output/
            docs/data/digest/${{ steps.draft.outputs.week }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit evidence file
        if: steps.draft.outputs.count != '0'
        env:
          WEEK: ${{ steps.draft.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/data/digest/${WEEK}.json"
          if git diff --cached --quiet; then
            echo "Evidence file unchanged"
            exit 0
          fi
          git commit -m "data: weekly digest evidence for week ending ${WEEK} [skip ci]"
          # Scan workflows push to main too; re-sync and retry on a race.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push the evidence file after 5 attempts."
          exit 1

      - name: Open or update the review issue
        if: steps.draft.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          gh label create digest-draft --color "5319e7" \
            --description "Weekly Mastodon digest drafts awaiting review" 2>/dev/null || true
          NUMBER=$(gh issue list --label digest-draft --state open --limit 100 \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file digest-output/issue.md
            echo "Updated issue #$NUMBER" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --title "$TITLE" --label digest-draft \
              --body-file digest-output/issue.md)
            echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Scan Relationships

on:
  # Run weekly on Sundays at 04:00 UTC (same as Lighthouse)
  schedule:
    - cron: '0 4 * * 0'

  # Allow manual trigger for a single country or all countries
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (e.g., ICELAND, FRANCE) — leave empty for all EU countries'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second (keep low for polite crawling)'
        required: false
        default: '1.0'
        type: string
      max_runtime:
        description: 'Maximum runtime in minutes per country (0 = no limit)'
        required: false
        default: '30'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-country:
    if: ${{ github.event.inputs.country == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        country:
          - AUSTRIA
          - BELGIUM
          - BULGARIA
          - CROATIA
          - CZECHIA
          - DENMARK
          - ESTONIA
          - FINLAND
          - FRANCE
          - GERMANY
          - GREECE
          - HUNGARY
          - ICELAND
          - IRELAND
          - ITALY
          - LATVIA
          - LITHUANIA
          - LUXEMBOURG
          - MALTA
          - NETHERLANDS
          - NORWAY
          - POLAND
          - PORTUGAL
          - REPUBLIC_OF_CYPRUS
          - ROMANIA
          - SLOVAKIA
          - SLOVENIA
          - SPAIN
          - SWEDEN
          - SWITZERLAND
          - UNITED_KINGDOM_UK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Scan relationships
        run: |
          python -m src.cli.scan_relationships \
            --country ${{ matrix.country }} \
            --rate-limit ${{ inputs.rate_limit || '1.0' }} \
            --max-runtime ${{ inputs.max_runtime || '30' }}

      - name: Upload country relationship data
        uses: actions/upload-artifact@v4
        with:
          name: relationship-data-${{ matrix.country }}
          path: data/work/relationships
          retention-days: 90

  # Single-country manual trigger: skip the matrix and scan just one country
  scan-single-country:
    if: ${{ github.event.inputs.country != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Scan relationships
        run: |
          python -m src.cli.scan_relationships \
            --country ${{ inputs.country }} \
            --rate-limit ${{ inputs.rate_limit || '1.0' }} \
            --max-runtime ${{ inputs.max_runtime || '30' }}

      - name: Upload country relationship data
        uses: actions/upload-artifact@v4
        with:
          name: relationship-data-${{ inputs.country }}
          path: data/work/relationships
          retention-days: 90

  aggregate:
    if: always() && (needs.scan-country.result != 'skipped' || needs.scan-single-country.result != 'skipped')
    needs: [scan-country, scan-single-country]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all country artifacts from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/work/relationships

          # Download each country artifact that exists in this workflow run
          ARTIFACTS=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("relationship-data-")) | .name' 2>/dev/null || echo "")

          for artifact_name in $ARTIFACTS; do
            echo "Downloading $artifact_name ..."
            gh run download ${{ github.run_id }} \
              --name "$artifact_name" \
              --dir data/work/relationships/"$artifact_name" 2>&1
          done

          echo "Downloaded relationship data:"
          find data/work/relationships -name "*.jsonl" -type f | head -50

      - name: Aggregate relationship data
        run: |
          mkdir -p docs/data

          # Combine all JSONL files (previous data + this run's per-country data)
          find data/work/relationships -name "*.jsonl" -exec cat {} \; > docs/data/relationships.jsonl

          echo "Aggregated relationship data:"
          wc -l docs/data/relationships.jsonl
          echo "Unique source domains:"
          cut -d'"' -f4 docs/data/relationships.jsonl | sort -u | wc -l

      - name: Upload aggregated relationship data artifact
        uses: actions/upload-artifact@v4
        with:
          name: relationship-data
          path: data/work/relationships
          retention-days: 90
          overwrite: true

      - name: Upload aggregated data for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages-data
          path: docs/data/relationships.jsonl
          retention-days: 365

      - name: Commit updated relationship data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there are changes
          if git diff --quiet docs/data/relationships.jsonl 2>/dev/null; then
            echo "No changes to commit"
          else
            git add docs/data/relationships.jsonl
            git commit -m "data: Update relationship scan results [skip ci]"
            git push
          fi

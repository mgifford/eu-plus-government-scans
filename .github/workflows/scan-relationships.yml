name: Scan Relationships

on:
  # Run 4x daily (every 6 hours) for progressive scanning
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (leave empty for all countries)'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second'
        required: false
        default: '2.0'
        type: string
      max_runtime:
        description: 'Maximum runtime in minutes (0 = no limit)'
        required: false
        default: '50'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within N days (default: 28)'
        required: false
        default: '28'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-relationships:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Find latest relationship metadata artifact run ID
        id: find-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=relationship-scan-metadata&per_page=1" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' 2>/dev/null || echo "")
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          if [ -n "$RUN_ID" ]; then
            echo "Found relationship-scan-metadata artifact from run $RUN_ID"
          else
            echo "No relationship-scan-metadata artifact found — will start with fresh database"
          fi

      - name: Download previous relationship scan metadata (if exists)
        if: steps.find-metadata.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: relationship-scan-metadata
          path: data/
          run-id: ${{ steps.find-metadata.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run progressive relationship scan
        run: |
          if [ -n "${{ inputs.country }}" ]; then
            python -m src.cli.scan_relationships \
              --country ${{ inputs.country }} \
              --rate-limit ${{ inputs.rate_limit || '2.0' }} \
              --max-runtime ${{ inputs.max_runtime || '50' }} \
              --skip-recently-scanned-days ${{ inputs.skip_recently_scanned_days || '28' }}
          else
            python -m src.cli.scan_relationships \
              --all \
              --rate-limit ${{ inputs.rate_limit || '2.0' }} \
              --max-runtime ${{ inputs.max_runtime || '50' }} \
              --skip-recently-scanned-days ${{ inputs.skip_recently_scanned_days || '28' }}
          fi

      - name: Guard against overwriting shared metadata with data-loss result
        if: always()
        id: db-guard
        run: |
          PREV_RUN_ID="${{ steps.find-metadata.outputs.run_id }}"
          if [ -n "$PREV_RUN_ID" ] && [ ! -f "data/metadata.db" ]; then
            echo "safe_to_upload=false" >> $GITHUB_OUTPUT
            echo "WARNING: Previous artifact found (run $PREV_RUN_ID) but data/metadata.db is missing after download. Skipping overwrite to protect existing data."
          else
            echo "safe_to_upload=true" >> $GITHUB_OUTPUT
            echo "Database present (or no prior artifact) — safe to update shared metadata."
          fi

      - name: Upload relationship scan metadata
        if: always() && steps.db-guard.outputs.safe_to_upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: relationship-scan-metadata
          path: data/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
          compression-level: 0

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/relationships.jsonl docs/data/summaries/ docs/data/coverage_report.json

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit"
          else
            git commit -m "data: Progressive relationship scan update [skip ci]"
            git pull --rebase -X theirs
            git push
          fi

      - name: Upload relationship data artifact
        uses: actions/upload-artifact@v7
        with:
          name: relationship-data
          path: |
            docs/data/relationships.jsonl
            docs/data/summaries/
            docs/data/coverage_report.json
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
          compression-level: 0

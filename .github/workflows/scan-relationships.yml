name: Scan Relationships

on:
  # Run 4x daily (every 6 hours) for progressive scanning
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to scan (leave empty for all countries)'
        required: false
        type: string
      rate_limit:
        description: 'Maximum requests per second'
        required: false
        default: '2.0'
        type: string
      max_runtime:
        description: 'Maximum runtime in minutes (0 = no limit)'
        required: false
        default: '50'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within N days (default: 31)'
        required: false
        default: '31'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-relationships:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        id: merge-metadata
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      # Runs commit at most once a day (see "Decide whether to commit data"),
      # so the newest dataset may exist only in the previous run's artifact.
      # Start from it; a listing or download failure aborts the job rather
      # than scanning from stale committed files.
      - name: Restore relationship data from latest artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/restore-relationship-data.sh docs/data

      - name: Run progressive relationship scan
        run: |
          if [ -n "${{ inputs.country }}" ]; then
            python -m src.cli.scan_relationships \
              --country ${{ inputs.country }} \
              --rate-limit ${{ inputs.rate_limit || '2.0' }} \
              --max-runtime ${{ inputs.max_runtime || '50' }} \
              --skip-recently-scanned-days ${{ inputs.skip_recently_scanned_days || '31' }}
          else
            python -m src.cli.scan_relationships \
              --all \
              --rate-limit ${{ inputs.rate_limit || '2.0' }} \
              --max-runtime ${{ inputs.max_runtime || '50' }} \
              --skip-recently-scanned-days ${{ inputs.skip_recently_scanned_days || '31' }}
          fi

      # Derived from the relationship dataset this workflow just refreshed, so
      # it regenerates in the same run rather than drifting behind it.
      - name: Generate dependency matrix
        run: python3 -m src.cli.generate_dependency_matrix

      # One dated snapshot per day (a later cycle replaces the same day's file).
      # These accumulate into the only record of how the corpus changes over
      # time; the relationship dataset itself only ever describes "now".
      - name: Record dated snapshot
        run: python3 -m src.cli.generate_snapshot

      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact relationship-scan-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload relationship-scan-metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: relationship-scan-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Check relationship shard sizes
        run: |
          LIMIT=$((64 * 1024 * 1024))
          FAILED=0
          for shard in docs/data/relationships/*.jsonl; do
            [ -e "$shard" ] || continue
            SIZE=$(stat -c%s "$shard")
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$shard is $SIZE bytes, over the ${LIMIT}-byte safety threshold"
              FAILED=1
            fi
          done
          exit $FAILED

      # Every commit of the ~30 MB shards adds to git history, which never
      # shrinks; at four commits a day that was ~136 MB a month.  Commit at
      # most once a day.  Runs in between still publish the full dataset as
      # the relationship-data artifact, which the next run restores.
      - name: Decide whether to commit data
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=docs/data/relationships/index.json&per_page=1" \
            --jq '.[0].commit.committer.date // ""')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$LAST" ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
          echo "Last data commit: $LAST (${AGE_HOURS}h ago)"
          if [ "$AGE_HOURS" -ge 20 ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "Skipping commit; the relationship-data artifact carries this run's results."
          fi

      - name: Commit updated data files
        if: steps.decide.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs/data/relationships/ docs/data/summaries/ \
            docs/data/coverage_report.json \
            docs/dependency-matrix.md docs/data/dependency-matrix.json \
            docs/data/dependency-matrix.csv docs/data/snapshots/

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit"
          else
            git commit -m "data: Progressive relationship scan update [skip ci]"
            # main can move between our rebase and push (sibling scan workflows
            # push concurrently -> "cannot lock ref"); re-sync and retry.
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Failed to push after 5 attempts (concurrent updates to main)."
                exit 1
              fi
              echo "Push rejected (attempt $attempt); re-syncing with origin/main and retrying..."
              sleep $((attempt * 3))
            done
          fi

      - name: Upload relationship data artifact
        uses: actions/upload-artifact@v7
        with:
          name: relationship-data
          path: |
            docs/data/relationships/
            docs/data/summaries/
            docs/data/coverage_report.json
            docs/data/dependency-matrix.json
            docs/data/dependency-matrix.csv
            docs/data/snapshots/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
          compression-level: 0

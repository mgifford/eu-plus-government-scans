name: URL Validation - Batched

on:
  # Run every 12 hours — URL validation is the LOWEST-priority background task.
  # Social media scans (every 2 hours) simultaneously confirm reachability AND
  # collect social-link data, making a separate URL-only pass unnecessary for
  # recently-scanned pages.  Scheduled at 01:00 and 13:00 UTC to sit between
  # social media scan runs (0/2/4/…/22 hour marks), reducing queueing in the
  # shared concurrency group.
  schedule:
    - cron: '0 1,13 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of countries per batch'
        required: false
        default: '4'
        type: string
      rate_limit:
        description: 'Maximum requests per second'
        required: false
        default: '2.0'
        type: string
      create_issue:
        description: 'Create GitHub issue to track progress'
        required: false
        default: 'true'
        type: boolean
      reset_failed:
        description: 'Re-queue previously failed countries so they are retried in this run'
        required: false
        default: 'false'
        type: boolean
      skip_recently_validated_days:
        description: 'Skip URLs already confirmed reachable by any scanner within this many days (0 = always re-validate)'
        required: false
        default: '30'
        type: string

# These four workflows are the only ones that write the validation-metadata
# artifact, and they share mutable batch-cycle state (validation_batch_state,
# issue_trigger_runs) that a row-level merge cannot reconcile. They therefore
# share one concurrency group so only one writes at a time. Every other scanner
# owns its own artifact and is no longer serialized against anything.
concurrency:
  group: validation-metadata-writers
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-urls-batch:
    runs-on: ubuntu-latest
    # Timeout matches BatchConfig.max_runtime_minutes in src/services/batch_coordinator.py
    # Set to 60 minutes to complete batches within ~1 hour
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Each scan workflow owns one metadata artifact and writes only that one,
      # so concurrent runs can no longer overwrite each other's results.  Collect
      # every artifact and merge them into the working database, which the
      # cross-scanner skip logic reads.  See src/lib/metadata_merge.py.
      - name: Collect metadata artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-metadata-artifacts.sh data/artifacts

      - name: Merge metadata artifacts
        id: merge-metadata
        run: |
          python3 -m src.cli.metadata_artifact merge \
            --into data/metadata.db \
            --from-dir data/artifacts

      - name: Run batch validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Set default values for scheduled runs
          BATCH_SIZE="${{ github.event.inputs.batch_size || '4' }}"
          RATE_LIMIT="${{ github.event.inputs.rate_limit || '2.0' }}"
          CREATE_ISSUE="${{ github.event.inputs.create_issue || 'true' }}"
          RESET_FAILED="${{ github.event.inputs.reset_failed || 'false' }}"
          SKIP_DAYS="${{ github.event.inputs.skip_recently_validated_days || '30' }}"
          
          # Build command
          CMD="python3 -m src.cli.validate_urls_batch \
            --batch-mode \
            --batch-size $BATCH_SIZE \
            --rate-limit $RATE_LIMIT \
            --skip-recently-validated-days $SKIP_DAYS"
          
          # Add create-issue flag if enabled
          if [ "$CREATE_ISSUE" = "true" ]; then
            CMD="$CMD --create-issue"
          fi
          
          # Reset failed countries back to pending so they are retried
          if [ "$RESET_FAILED" = "true" ]; then
            CMD="$CMD --reset-failed"
          fi
          
          # Run validation
          $CMD 2>&1 | tee batch-validation-output.txt
      
      - name: Generate validation report
        if: always()
        run: |
          python3 -m src.cli.generate_validation_report \
            --output validation-report.md

      # Upload only the tables this workflow owns.  Uploading the merged
      # database would republish a stale snapshot of every other scanner's
      # tables, undoing the isolation the split exists to provide.
      - name: Extract owned metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m src.cli.metadata_artifact extract \
            --artifact validation-metadata \
            --source data/metadata.db \
            --into data/upload/metadata.db

      - name: Upload validation-metadata
        if: always() && steps.merge-metadata.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: validation-metadata
          path: data/upload/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-validation-report-${{ github.run_number }}
          path: |
            validation-report.md
            batch-validation-output.txt
          retention-days: 30
          if-no-files-found: warn
      
      - name: Display report summary
        if: always()
        run: |
          if [ -f validation-report.md ]; then
            echo "## Validation Report Summary" >> $GITHUB_STEP_SUMMARY
            cat validation-report.md >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Batch Processing Info" >> $GITHUB_STEP_SUMMARY
          echo "- Batch Size: ${{ github.event.inputs.batch_size || '4' }} countries" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '2.0' }} req/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
